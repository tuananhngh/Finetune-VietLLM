model_name_or_path: trl-internal-testing/tiny-Qwen3ForCausalLM
dtype: float32
use_peft: true
lora_r: 8
lora_alpha: 16
lora_target_modules: all-linear

datasets:
  - path: data/examples/preference_vi.jsonl
    format: preference
eval_split_size: 0

output_dir: outputs/smoke-test-dpo
max_length: 512
max_steps: 2
per_device_train_batch_size: 2
learning_rate: 1.0e-4
logging_steps: 1
save_strategy: "no"
report_to: none
bf16: false
resume: none

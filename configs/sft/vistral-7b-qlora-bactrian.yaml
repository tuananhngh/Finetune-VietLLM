# Port of the original POC (Vistral-7B-Chat + Bactrian-X vi) to the new pipeline.
# Vistral's chat template has no TRL training variant, so we train in prompt/completion form
# (loss on the final answer only), which works with any chat template.

model_name_or_path: Viet-Mistral/Vistral-7B-Chat
dtype: bfloat16
attn_implementation: sdpa
use_peft: true
load_in_4bit: true
use_bnb_nested_quant: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules: all-linear

datasets:
  # Bactrian-X (Vietnamese split). Loaded from its raw file: the repo's loading script is not
  # supported by datasets>=4.
  - path: json
    data_files: hf://datasets/MBZUAI/Bactrian-X/data/vi.json.gz
    split: train
    format: alpaca
conversation_format: prompt_completion
eval_split_size: 0.01

output_dir: outputs/vistral-7b-qlora-bactrian
run_name: vistral-7b-qlora-bactrian
max_length: 2048
packing: false
completion_only_loss: true
use_liger_kernel: true
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_steps: 0.03               # float < 1 = ratio of total steps
optim: paged_adamw_8bit
bf16: true
logging_steps: 10
eval_strategy: steps
eval_steps: 200
save_steps: 200
save_total_limit: 3
report_to: wandb

resume: auto
merge_after_training: true

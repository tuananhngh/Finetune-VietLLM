# FSDP + QLoRA for large models (e.g. 32B on 2x 48GB or 2x 80GB GPUs). Advanced:
#   bash scripts/train.sh configs/sft/qwen3-32b-qlora-fsdp.yaml configs/accelerate/fsdp_qlora.yaml

model_name_or_path: Qwen/Qwen3-32B
dtype: bfloat16
attn_implementation: sdpa
use_peft: true
load_in_4bit: true
use_bnb_nested_quant: true
bnb_4bit_quant_storage: bfloat16   # required so FSDP can shard the 4-bit weights
lora_r: 32
lora_alpha: 32
use_rslora: true
lora_dropout: 0.05
lora_target_modules: all-linear

datasets:
  # Bactrian-X (Vietnamese split). Loaded from its raw file: the repo's loading script is not
  # supported by datasets>=4.
  - path: json
    data_files: hf://datasets/MBZUAI/Bactrian-X/data/vi.json.gz
    split: train
    format: alpaca
conversation_format: messages
eval_split_size: 0.01

output_dir: outputs/qwen3-32b-qlora-fsdp
run_name: qwen3-32b-qlora-fsdp
max_length: 2048
packing: true
assistant_only_loss: true
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: true}
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_steps: 0.03               # float < 1 = ratio of total steps
optim: adamw_torch
bf16: true
logging_steps: 10
eval_strategy: steps
eval_steps: 200
save_steps: 200
save_total_limit: 2
report_to: wandb

resume: auto
merge_after_training: false        # merge separately on a machine with enough CPU RAM (vietllm-merge)
